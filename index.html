<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Conversor de moedas</title>
  </head>

  <body>
    <header>
      <img
        class="img-01"
        src="./assets/img-header-moedas.gif"
        alt="gif-moeda-girando"
      />
      <h1>CONVERSOR DE <br />MO€DA$<br /></h1>
    </header>

    <div class="header-responsivo">
      <img
        class="img-01-responsivo"
        src="./assets/img-header-moedas.gif"
        alt="gif-moeda-girando"
      />
      <h1 class="titulo-responsivo">CONVERSOR DE <br />MO€DA$<br /></h1>
      <img
        class="img-01-responsivo-b"
        src="./assets/img-header-moedas.gif"
        alt="gif-moeda-girando"
      />
    </div>

    <main>
      <label>
        Converter DE:
        <select class="from-currency">
          <option value="BRL">Real</option>
          <option value="USD">Dólar</option>
          <option value="EUR">Euro</option>
          <option value="GBP">Libra</option>
          <option value="BTC">Bitcoin</option>
        </select>
      </label>

      <label>
        Converter PARA:
        <select class="to-currency">
          <option value="USD">Dólar</option>
          <option value="BRL">Real</option>
          <option value="EUR">Euro</option>
          <option value="GBP">Libra</option>
          <option value="BTC">Bitcoin</option>
        </select>
      </label>

      <label>
        Valor:
        <input type="number" class="digite-o-valor" placeholder="100" />
      </label>

      <button class="convert">Converter</button>

      <section>
        <div class="colunas">
          <img class="from-image" src="./assets/img-real-brasil.png" />
          <p class="p-01"></p>
        </div>

        <div class="colunas">
          <img class="to-image" src="./assets/img-dolar-usa.png" />
          <p class="p-02"></p>
        </div>
      </section>
    </main>

    <img
      class="img-omega"
      src="./assets/img-backgrund-moedas-ok.png"
      alt="escada-moedas"
    />
  </body>

  <script src="./script.js"></script>
</html>
